version: "3.9"
services:
  backend:
    build: ./backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: rag_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend

