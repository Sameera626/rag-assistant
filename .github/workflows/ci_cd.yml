name: RAG Assistant CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # step 1: Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # step 2; Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # step 3: Install dependencies
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        cd ../frontend
        pip install -r requirements.txt

    # step 4: Run tests
    - name: Run tests
      run: |
        pytest --maxfail=1 --disable-warnings -q || echo "No tests found."

    # step 5: Lint frontend code
    - name: Lint Streamlit app
      run: |
        cd frontend
        python -m py_compile streamlit_app.py

    # step 6: Azure Login (authenticate before any az commands)
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}


    # step 7: Login to Azure Container Registry
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: sameeraragregistry.azurecr.io
        username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

    # step 8: Buil and Push backend Docker Image to ACR
    - name: Build and Push Docker Image(backend)
      run: |
        docker build -t sameeraragregistry.azurecr.io/rag-assistant-backend:latest ./backend
        docker push sameeraragregistry.azurecr.io/rag-assistant-backend:latest
    
    # step 9: Build and Push frontend Docker Image to ACR
    - name: Build and Push Docker Image(frontend)
      run: |
        docker build -t sameeraragregistry.azurecr.io/rag-assistant-frontend:latest ./frontend
        docker push sameeraragregistry.azurecr.io/rag-assistant-frontend:latest

    # step 10: Deploy Dcoker Images to Azure Container Apps
    - name: Deploy multicontainer app 
      uses: azure/CLI@v1
      with:
        azcliversion: 2.60.0
        inlineScript: |
          az containerapp update \
          --name rag-assistant-app \
          --resource-group rag-assintant-rg \
          --image sameeraragregistry.azurecr.io/rag-assistant-backend:latest \
          --image sameeraragregistry.azurecr.io/rag-assistant-frontend:latest

    



